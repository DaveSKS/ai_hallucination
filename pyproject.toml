[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hallu-detect"
version = "0.1.0"
description = "Evidence-grounded verification of generated text using natural language inference."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "transformers>=4.40",
]

[project.optional-dependencies]
train = [
    "accelerate>=0.28",
    "datasets>=2.18",
    "scikit-learn>=1.3",
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]
dashboard = [
    "streamlit>=1.32",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
hallu-verify = "hallu_detect.cli:main"
hallu-train = "hallu_detect.train:main"
hallu-evaluate = "hallu_detect.evaluate:main"
hallu-prepare-mnli = "hallu_detect.prepare_mnli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
